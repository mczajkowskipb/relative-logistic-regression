name: RLR teacher capacity diagnostic 11 cohorts D V exact frontier

on:
  push:
    branches: [analysis/rlr-teacher-compressibility-frontier-v1]
    paths:
      - '.github/workflows/rlr-teacher-capacity11-DV-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    name: RLR CAPACITY D V ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Install actual original switchBox and glmnet
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
            r-cran-jsonlite r-cran-gplots
          NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
            https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
            https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
              "$MIRROR/$NAME" -o "/tmp/$NAME"; then break; fi
          done
          test -s "/tmp/$NAME"
          sudo R CMD INSTALL "/tmp/$NAME"
      - name: Check frozen original and exact 0-3 capacity unit tests
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'for (p in c("R/experimental/rlr_teacher_compressibility_core_v1.R","R/experimental/test_rlr_teacher_compressibility_v1.R","R/experimental/rlr_teacher_compressibility_first11_DV_v1.R")) parse(p)' >/dev/null
          python3 -m py_compile scripts/rlr_teacher_capacity_first11_DV_audit_v1.py
          Rscript --vanilla R/experimental/test_rlr_teacher_compressibility_v1.R 2>&1 | tee /tmp/rlrwt_unit.log
          grep -qx 'RLR_CAPACITY_UNIT_TEST=PASS' /tmp/rlrwt_unit.log
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          mkdir -p "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID"
          git rev-parse HEAD > "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/SOURCE_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/ORIGINAL_RLR_CORE_SHA.txt"
          cp /tmp/rlrwt_unit.log "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/unit.log"
      - name: Fetch original paper named public Schliep reconstructed cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py \
            --dataset "$RLR_DATASET_ID" 2>&1 | tee "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" \
            "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/source_manifest.json"
      - name: Fit original RLR20 D OOF and 8 exact teacher capacity diagnostics
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_teacher_compressibility_first11_DV_v1.R 2>&1 | tee "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'RLR_CAPACITY_9_FIXED_ARMS_DV=PASS' "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'RLR_CAPACITY_0_1_2_3_TRAIN_ONLY=PASS' "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'RLR_CAPACITY_ORIGINAL_OUTER_E_UNREAD=PASS' "results/rlr_teacher_capacity11_DV_v1/$RLR_DATASET_ID/fit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlr-capacity-v1-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/rlr_teacher_capacity11_DV_v1/
          retention-days: 21
          if-no-files-found: warn
  audit:
    name: Independent 99 heldout patient scores and exact training frontier
    needs: cohort
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rlr-capacity-v1-*
          path: downloaded
      - name: Real patient replay and exact 11 dataset signed inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/rlr-capacity-v1-audit
          python3 scripts/rlr_teacher_capacity_first11_DV_audit_v1.py \
            --input downloaded --out results/rlr-capacity-v1-audit | tee results/rlr-capacity-v1-audit/audit.log
          grep -qx 'RLR_CAPACITY_ALL11_NINETYNINE_PATIENT_METHOD_SUMMARIES_REPLAYED=PASS' results/rlr-capacity-v1-audit/audit.log
          grep -qx 'RLR_CAPACITY_EXACT_0_TO_3_FRONTIER_DOMINANCE_D=PASS' results/rlr-capacity-v1-audit/audit.log
          grep -qx 'RLR_CAPACITY_EXACT_ELEVEN_COHORT_SIGNFLIPS=PASS' results/rlr-capacity-v1-audit/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlr-capacity-v1-all11-independent-audit-${{ github.run_id }}
          path: results/rlr-capacity-v1-audit/
          retention-days: 21
