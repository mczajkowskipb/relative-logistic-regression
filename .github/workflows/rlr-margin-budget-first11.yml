name: RLR matched effective pair budget and margin-aware selection first11

on:
  push:
    branches: [analysis/rlr-margin-aware-budget-match-v1]
    paths:
      - '.github/workflows/rlr-margin-budget-first11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    name: 'RLR margin budget ${{ matrix.dataset }}'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Install original RLR and REAL switchBox kTSP dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
             r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
             r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
             https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
             https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
                "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
      - name: Verify original unpublished manuscript, R syntax and mathematical rank invariance
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'for(f in c("R/experimental/rlr_margin_aware_budget_core_v1.R","R/experimental/rlr_margin_aware_budget_first11_v1.R","R/experimental/test_rlr_margin_aware_budget_v1.R"))parse(f)' >/dev/null
          python3 -m py_compile scripts/rlr_margin_aware_budget_first11_audit_v1.py
          Rscript --vanilla R/experimental/test_rlr_margin_aware_budget_v1.R | tee /tmp/MB_RLR_unit.log
          grep -qx 'MB_RLR_UNIT_COMPLETE=PASS' /tmp/MB_RLR_unit.log
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          mkdir -p "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID"
          git rev-parse HEAD > "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/SOURCE_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > \
            "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/ORIGINAL_RLR_CORE_SHA.txt"
          cp /tmp/MB_RLR_unit.log "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/unit.log"
      - name: Fetch exactly original-named source with public provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py \
             --dataset "$RLR_DATASET_ID" 2>&1 | tee \
             "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' \
             "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" \
             "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/source_manifest.json"
      - name: Fit original and margin-aware RLR, budget-matched real kTSP and audit E predictions
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_margin_aware_budget_first11_v1.R 2>&1 | tee \
             "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'MB_RLR_ALL_MATCHED_E_METHODS_PREDICTIONS=PASS' \
             "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'MB_RLR_ALL_COMPLEXITY_MATCHING_FROM_T_ONLY=PASS' \
             "results/rlr_margin_budget_first11_v1/$RLR_DATASET_ID/fit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: margin-budget-first11-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/rlr_margin_budget_first11_v1/
          retention-days: 21
          if-no-files-found: warn
  audit:
    name: Independently replay original eleven E patient-matched margin-aware and kTSP budgets
    needs: cohort
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: margin-budget-first11-*
          path: downloaded
      - name: Independently verify 132 model-cohort patient probability metrics and train-only K
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/rlr-margin-budget-first11-audit
          python3 scripts/rlr_margin_aware_budget_first11_audit_v1.py \
             --input downloaded --out results/rlr-margin-budget-first11-audit \
             | tee results/rlr-margin-budget-first11-audit/audit.log
          grep -qx 'MB_RLR_ALL_11_DATASETS_132_METHOD_ROWS_REPLAYED=PASS' \
             results/rlr-margin-budget-first11-audit/audit.log
          grep -qx 'MB_RLR_REAL_KTSP_MATCH_K_SELECTED_FROM_ORIGINAL_RLR_T_ONLY=PASS' \
             results/rlr-margin-budget-first11-audit/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlr-margin-budget-first11-summary-${{ github.run_id }}
          path: results/rlr-margin-budget-first11-audit/
          retention-days: 21
