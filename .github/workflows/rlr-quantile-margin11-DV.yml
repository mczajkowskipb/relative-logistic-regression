name: RLR per-pair quantile ordinal margin 11 cohort strict D V pilot

on:
  push:
    branches: [analysis/rlr-quantile-ordinal-margin-v1]
    paths:
      - '.github/workflows/rlr-quantile-margin11-DV.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    name: 'QRLR DV ${{ matrix.dataset }}'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Install exact original RLR switchBox+glmnet runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
            r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
            https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
            https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
              "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
      - name: Confirm unpublished RLR frozen and train-only quantile ordinal ranks
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'for(f in c("R/experimental/rlr_quantile_ordinal_margin_core_v1.R","R/experimental/test_rlr_quantile_ordinal_margin_v1.R","R/experimental/rlr_quantile_ordinal_margin_first11_DV_v1.R"))parse(f)' >/dev/null
          python3 -m py_compile scripts/rlr_quantile_ordinal_margin_first11_DV_audit_v1.py
          Rscript --vanilla R/experimental/test_rlr_quantile_ordinal_margin_v1.R 2>&1 | tee /tmp/QRLR_unit.log
          grep -qx 'QRLR_MECHANICAL_TESTS=PASS' /tmp/QRLR_unit.log
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          mkdir -p "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID"
          git rev-parse HEAD > "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/SOURCE_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/ORIGINAL_RLR_CORE_SHA.txt"
          cp /tmp/QRLR_unit.log "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/unit.log"
      - name: Retrieve only original paper named source and ensure no claim of ARFF identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py \
            --dataset "$RLR_DATASET_ID" 2>&1 | tee \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/source_manifest.json"
      - name: Six arms q0 q25 q50 K10 K20 on D/V with original m10 exact fidelity
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_quantile_ordinal_margin_first11_DV_v1.R 2>&1 | tee \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'QRLR_ORIGINAL_Q0_PROBABILITY_PARITY=PASS' \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'QRLR_ALL_SIX_DV_MODELS_AND_PATIENT_ACTIVITY=PASS' \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'QRLR_OUTER_E_NEVER_USED=PASS' \
            "results/rlr_quantile_ordinal_margin11_DV_v1/$RLR_DATASET_ID/fit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QRLR-DV11-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/rlr_quantile_ordinal_margin11_DV_v1/
          retention-days: 21
          if-no-files-found: warn
  audit:
    name: Recalculate 66 arm patientwise V scores and inactive coefficients
    needs: cohort
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: QRLR-DV11-*
          path: downloaded
      - name: Independent patient probability and K activity audit all 11
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/rlr-quantile-ordinal-margin11-audit
          python3 scripts/rlr_quantile_ordinal_margin_first11_DV_audit_v1.py \
            --input downloaded --out results/rlr-quantile-ordinal-margin11-audit \
            | tee results/rlr-quantile-ordinal-margin11-audit/audit.log
          grep -qx 'QRLR_ALL11_SIXTY_SIX_METHOD_PATIENT_METRICS_REPLAYED=PASS' \
            results/rlr-quantile-ordinal-margin11-audit/audit.log
          grep -qx 'QRLR_NO_OUTER_E_OR_SAMPLE_OVERLAP=PASS' \
            results/rlr-quantile-ordinal-margin11-audit/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QRLR-DV11-independent-summary-${{ github.run_id }}
          path: results/rlr-quantile-ordinal-margin11-audit/
          retention-days: 21
