name: RLR full 470-fold same-pairs comparison
on:
  push:
    branches: [analysis/rlr-same-pairs-full11-470-cv-v1]
    paths:
      - 'docs/rlr_full11_run_trigger_v1.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cohort-smoke:
    name: 'Full RLR paper cohort: ${{ matrix.dataset }}'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
      RLR_MAX_SPLITS: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Provision original RLR dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-foreign r-cran-glmnet r-cran-proc r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib https://bioconductor.uib.no/packages/3.18/bioc/src/contrib; do
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 35 "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sha256sum "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
          Rscript --vanilla -e 'for(p in c("foreign","glmnet","pROC","switchBox","jsonlite")) stopifnot(requireNamespace(p,quietly=TRUE));cat("FULL11_FROZEN_RLR_DEPS=PASS\n")'
      - name: Source and code preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rlr_full11_source_gate_v1.py scripts/rlr_full11_fetch_one_v1.py scripts/rlr_full11_same_pairs_audit_v1.py
          Rscript --vanilla -e 'parse("R/new/07_world_protocol_utils.R");parse("R/experimental/rlr_full11_same_pairs_v1.R")' >/dev/null
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          echo "$GITHUB_SHA" > "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/RUN_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/ORIGINAL_RLR_CORE_SHA.txt"
      - name: Fetch paper source and preserve SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py --dataset "$RLR_DATASET_ID" 2>&1 | tee "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/fetch.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/fetch.log"
      - name: Run original RLR and regularized equal-vote control
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_full11_same_pairs_v1.R 2>&1 | tee "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/model_full.log"
          grep -qx 'FULL11_MODE=FULL' "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/model_full.log"
      - name: Independently audit heldout E-patient scores
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rlr_full11_same_pairs_audit_v1.py --dataset "$RLR_DATASET_ID" --mode full 2>&1 | tee "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/audit_full.log"
          grep -qx 'FULL11_AUDIT_SPLITS_PATIENT_LEVEL_CONSISTENT=PASS' "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/audit_full.log"
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlr-full11-full-${{ matrix.dataset }}-${{ github.run_id }}
          path: |
            results/rlr_full11_same_pairs_v1/${{ matrix.dataset }}/*.log
            results/rlr_full11_same_pairs_v1/${{ matrix.dataset }}/*.txt
            results/rlr_full11_same_pairs_v1/${{ matrix.dataset }}/*.json
            results/rlr_full11_same_pairs_v1/${{ matrix.dataset }}/full/*.csv
          if-no-files-found: warn
          retention-days: 21

  aggregate-evidence:
    name: 'Independent 11-dataset summary and exact signed-rank tests'
    needs: cohort-smoke
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rlr-full11-full-*
          path: downloaded
          merge-multiple: false
      - name: Dataset-level 470-fold evidence aggregation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rlr_full11_aggregate_v1.py
          mkdir -p results/rlr_full11_aggregate_v1
          python3 scripts/rlr_full11_aggregate_v1.py --mode full --input downloaded --out results/rlr_full11_aggregate_v1 | tee results/rlr_full11_aggregate_v1/full11_stats.log
          grep -qx 'FULL11_AGGREGATE_470_CV_FOLDS_PER_MODEL=PASS' results/rlr_full11_aggregate_v1/full11_stats.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlr-full11-overall-470-evidence-${{ github.run_id }}
          path: results/rlr_full11_aggregate_v1/
          retention-days: 21
