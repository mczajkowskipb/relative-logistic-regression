name: SA-RLR 11 canonical cohorts training-only mechanism V1

on:
  push:
    branches: [analysis/rlr-selective-anchor-gated-v1]
    paths:
      - '.github/workflows/rlr-sa-trainonly-full11-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inner-train:
    name: 'SA-RLR train-only ${{ matrix.dataset }}'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Provision original RLR dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
            r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
            https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
            https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
                 "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
          Rscript --vanilla -e 'for(p in c("glmnet","switchBox","foreign","pROC"))stopifnot(requireNamespace(p,quietly=TRUE))'
      - name: Parse source, confirm unmodified original RLR and prepare manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'parse("R/new/07_world_protocol_utils.R");parse("R/experimental/rlr_sa_trainonly_full11_feasibility_v1.R")' >/dev/null
          python3 -m py_compile scripts/rlr_full11_source_gate_v1.py scripts/rlr_full11_fetch_one_v1.py scripts/rlr_sa_trainonly_full11_aggregate_v1.py
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          mkdir -p "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID"
          echo "$GITHUB_SHA" > "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/SOURCE_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/ORIGINAL_RLR_CORE_SHA.txt"
          printf '%s\n' 'CANONICAL 11 cohort names; 5fold seed42 FIRST SPLIT ONLY; outer E patient outcomes never evaluated; original paper processed ARFF SHA not verified; only original T and D/V inside T; no publication effectiveness claim.' > "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/PROTOCOL.txt"
      - name: Fetch public-source cohort and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py \
            --dataset "$RLR_DATASET_ID" 2>&1 | tee \
            "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' \
            "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" \
             "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/input_source_manifest.json"
      - name: Measure inner-training selective anchor root feasibility
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_sa_trainonly_full11_feasibility_v1.R 2>&1 | tee \
            "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'SA_TRAIN_COHORT_DIAGNOSTIC_COMPLETE=PASS' \
            "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'SA_TRAIN_EXTERNAL_E_LABELS_NOT_USED=PASS' \
            "results/sa_rlr_trainonly_v1/$RLR_DATASET_ID/fit.log"
      - name: Archive train-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa-rlr-trainonly-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/sa_rlr_trainonly_v1/
          retention-days: 21
          if-no-files-found: warn

  summary:
    name: Independent 11-cohort D/V feasibility aggregation
    needs: inner-train
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sa-rlr-trainonly-*
          path: downloaded
      - name: Aggregate exact cohort count and acceptance criteria
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rlr_sa_trainonly_full11_aggregate_v1.py \
            --input downloaded --out results/sa_rlr_trainonly_aggregate_v1 \
            | tee results/sa_rlr_trainonly_aggregate_v1_summary.log
          grep -qx 'SA_TRAIN_11_DATASETS_INDEPENDENT_INVENTORY=PASS' \
            results/sa_rlr_trainonly_aggregate_v1_summary.log
          cp results/sa_rlr_trainonly_aggregate_v1_summary.log \
             results/sa_rlr_trainonly_aggregate_v1/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sa-rlr-trainonly-11-summary-${{ github.run_id }}
          path: results/sa_rlr_trainonly_aggregate_v1/
          retention-days: 21
