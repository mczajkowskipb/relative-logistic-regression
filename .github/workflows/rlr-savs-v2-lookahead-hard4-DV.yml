name: RLR SAVS2 lookahead D/V hard four cohorts

on:
  push:
    branches: [analysis/rlr-selective-vote-lookahead-v2]
    paths:
      - '.github/workflows/rlr-savs-v2-lookahead-hard4-DV.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    name: 'SAVS2 lookahead ${{ matrix.dataset }}'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [chen-2002, pomeroy-2002-v1, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Install exact original RLR and switchBox R packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
             r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
             r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
             https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
             https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
                "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
      - name: Prove exact SAVS1 sparse-vote mechanics and source syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'for(p in c("R/experimental/rlr_selective_anchor_vote_lookahead_v2.R","R/experimental/rlr_savs_lookahead_hard4_DV_v2.R"))parse(p)' >/dev/null
          Rscript --vanilla R/experimental/test_rlr_selective_anchor_vote_stump_v1.R 2>&1 | tee /tmp/savs_v2_unit.log
          grep -qx 'SAVS_ALL_MECHANICAL_TESTS=PASS' /tmp/savs_v2_unit.log
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          mkdir -p "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID"
          git rev-parse HEAD > "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/SOURCE_SHA.txt"
          cp /tmp/savs_v2_unit.log "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/unit.log"
      - name: Get original-paper named cohort from audited public source
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py --dataset "$RLR_DATASET_ID" 2>&1 | tee \
             "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' \
             "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" \
             "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/source_manifest.json"
      - name: Compare sparse anchor-stump lookahead vs matched global voting on V
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_savs_lookahead_hard4_DV_v2.R 2>&1 | tee \
             "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/fit.log"
          grep -qx 'SAVS_V2_FOUR_HARD_COHORT_D_ONLY_LOOKAHEAD_COMPLETE=PASS' \
             "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/fit.log"
          grep -qx 'SAVS_V2_OUTER_E_UNREAD=PASS' \
             "results/rlr_savs_lookahead_hard4_DV_v2/$RLR_DATASET_ID/fit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: savs-v2-hard4-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/rlr_savs_lookahead_hard4_DV_v2/
          retention-days: 21
          if-no-files-found: warn
