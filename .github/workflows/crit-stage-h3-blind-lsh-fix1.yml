name: CRIT Stage H3 blind XOR LSH fix1

on:
  push:
    branches:
      - analysis/crit-stageH3-blind-xor-lsh-fix1-v1
    paths:
      - '.github/workflows/crit-stage-h3-blind-lsh-fix1.yml'
      - 'scripts/crit_stageH3_blind_lsh_pilot.py'
      - 'scripts/test_crit_stageH3_hash_join.py'
      - 'scripts/crit_stageH3_independent_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-lsh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned synthetic-only scientific dependency
        run: python -m pip install 'numpy==2.3.4'
      - name: Parse scripts and run differential unit tests
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/crit_stageH3_blind_lsh_pilot.py \
            scripts/crit_stageH3_independent_audit.py \
            scripts/test_crit_stageH3_hash_join.py
          python scripts/test_crit_stageH3_hash_join.py
      - name: Create isolated evidence directory
        run: |
          mkdir -p results/crit_stageH3_blind_lsh_fix1_v1
          printf '%s\n' "$GITHUB_SHA" > results/crit_stageH3_blind_lsh_fix1_v1/SOURCE_SHA.txt
          printf '%s\n' "D-only synthetic 40 independent studies, blind XOR pair-product signature LSH 18 bits 24 tables, no RLR or V/E" > results/crit_stageH3_blind_lsh_fix1_v1/PROTOCOL.txt
      - name: Blind pair discovery on synthetic D
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/crit_stageH3_blind_lsh_pilot.py 2>&1 \
            | tee results/crit_stageH3_blind_lsh_fix1_v1/run.log
          grep -qx 'STAGEH3_40_BLIND_D_ONLY_STUDIES=PASS' results/crit_stageH3_blind_lsh_fix1_v1/run.log
          grep -qx 'STAGEH3_24_TABLE_LSH_XOR_PAIR_DISCOVERY=PASS' results/crit_stageH3_blind_lsh_fix1_v1/run.log
      - name: Independent D score replay on 240 finalists
        shell: bash
        run: |
          set -euo pipefail
          python scripts/crit_stageH3_independent_audit.py 2>&1 \
            | tee results/crit_stageH3_blind_lsh_fix1_v1/independent_audit.log
          grep -qx 'STAGEH3_240_TOP6_SCORES_RECOMPUTED_FROM_FRESH_D=PASS' \
            results/crit_stageH3_blind_lsh_fix1_v1/independent_audit.log
          grep -qx 'STAGEH3_40_STUDY_BLIND_SOURCE_INVENTORY_AUDITED=PASS' \
            results/crit_stageH3_blind_lsh_fix1_v1/independent_audit.log
          printf 'STAGEH3_BATCH_EXIT=0\n' > results/crit_stageH3_blind_lsh_fix1_v1/status.txt
      - name: Archive scientific evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crit-stage-h3-blind-lsh-fix1-${{ github.run_id }}
          path: results/crit_stageH3_blind_lsh_fix1_v1/
          if-no-files-found: warn
          retention-days: 14
