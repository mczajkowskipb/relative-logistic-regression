name: SAVS anchor selective abstention stump all11 TRAIN D/V v1

on:
  push:
    branches: [analysis/rlr-anchor-selective-abstention-stump-v1]
    paths:
      - '.github/workflows/rlr-savs-original11-DV-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    name: 'SAVS D/V ${{ matrix.dataset }}'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Install original RLR and switchBox source environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
             r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
             r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
             https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
             https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
                "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
      - name: Verify original unpublished RLR manuscript and validate model mechanics
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'for(p in c("R/experimental/rlr_selective_anchor_vote_stump_v1.R","R/experimental/rlr_savs_original11_DV_v1.R","R/experimental/test_rlr_selective_anchor_vote_stump_v1.R"))parse(p)' >/dev/null
          Rscript --vanilla R/experimental/test_rlr_selective_anchor_vote_stump_v1.R 2>&1 | tee /tmp/savs_unit.log
          grep -qx 'SAVS_ALL_MECHANICAL_TESTS=PASS' /tmp/savs_unit.log
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          mkdir -p "results/rlr_savs_inner11_v1/$RLR_DATASET_ID"
          git rev-parse HEAD > "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/SOURCE_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/ORIGINAL_RLR_CORE_SHA.txt"
          cp /tmp/savs_unit.log "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/unit.log"
      - name: Obtain original-named CompCancer public source and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py \
             --dataset "$RLR_DATASET_ID" 2>&1 | tee \
             "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' \
             "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" \
             "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/source_manifest.json"
      - name: D-only sparse anchor stump and GLOBAL same-rule controls on original inner V
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_savs_original11_DV_v1.R 2>&1 | tee \
             "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'SAVS_DV_ORIGINAL_E_NEVER_TOUCHED=PASS' \
             "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/fit.log"
          grep -qx 'SAVS_DV_EIGHT_MATCHED_MODELS_AND_PATIENT_ACTIVITIES=PASS' \
             "results/rlr_savs_inner11_v1/$RLR_DATASET_ID/fit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: savs-inner11-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/rlr_savs_inner11_v1/
          retention-days: 21
          if-no-files-found: warn
