name: SAVS GLOBAL4 first E fold versus REAL kTSP4 kTSP50 RLR50

on:
  push:
    branches: [analysis/rlr-savs-global4-full470-v1]
    paths:
      - '.github/workflows/rlr-savs-global4-firstfold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    name: 'Global4 E first ${{ matrix.dataset }}'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
      RLR_REP: "0"
      RLR_FOLD: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install original RLR actual switchBox and glmnet R dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
             r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
             r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
             https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
             https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
               "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
      - name: Freeze original manuscript source SHA and check code syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'parse("R/experimental/rlr_savs_global4_original470_onefold_v1.R")' >/dev/null
          python3 -m py_compile scripts/rlr_savs_global4_outer_audit_v1.py
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID"
          mkdir -p "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00"
          git rev-parse HEAD > "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/SOURCE_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/ORIGINAL_RLR_CORE_SHA.txt"
          printf '%s\n' 'PUBLIC RECONSTRUCTED source not yet matching processed original paper ARFF checksum; first original E fold only, no tuning from E. Two predefined global selective one-sided four-rule rank-margin worlds vs same-patient real kTSP4/10/20/50 original RLR10/20/50 valueLR and TSP1. External E scores are exploratory, not independent confirmation.' > \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/PROTOCOL.txt"
      - name: Fetch exactly same original-named public source and SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py --dataset "$RLR_DATASET_ID" 2>&1 | tee \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/source_manifest.json"
      - name: Fit genuine kTSP4 kTSP50 original RLR and abstaining global4 on same E
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_savs_global4_original470_onefold_v1.R 2>&1 | tee \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/fit.log"
          grep -qx 'SAVS470_MATCHED_E_TRUE_KTSP4_KTSP50_RLR50_GLOBAL4=PASS' \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/fit.log"
          grep -qx 'SAVS470_RANK_ONLY_TRAIN_SELECTED_CLASSIFIER_NO_OUTER_LEAK=PASS' \
             "results/savs_global4_full470_v1/$RLR_DATASET_ID/rep00_fold00/fit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: savs-global4-first-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/savs_global4_full470_v1/
          retention-days: 21
          if-no-files-found: warn
  audit:
    name: Independent patient E score replay original 11 cohorts firstfold
    needs: cohort
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: savs-global4-first-*
          path: downloaded
      - name: Independently recompute patientwise original 11 method fold comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/savs-global4-first-audit
          python3 scripts/rlr_savs_global4_outer_audit_v1.py \
            --input downloaded --out results/savs-global4-first-audit \
            | tee results/savs-global4-first-audit/audit.log
          grep -qx 'SAVS470_121_METHOD_FOLDS_PATIENT_METRICS_REPLAYED=PASS' \
             results/savs-global4-first-audit/audit.log
          grep -qx 'SAVS470_PERSONWISE_ABSTENTION_MATCHES_RULE_COUNTS=PASS' \
             results/savs-global4-first-audit/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: savs-global4-first-summary-${{ github.run_id }}
          path: results/savs-global4-first-audit/
          retention-days: 21
