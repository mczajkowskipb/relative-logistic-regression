name: RLR vs binary ENET MCP full outer5 across 11 cohorts
on:
  push:
    branches: [analysis/rlr-binary-repro-outer5-v2]
    paths:
      - '.github/workflows/rlr-binary-outer5-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cohort:
    name: RLR binary outer5 ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [alizadeh-2000-v1, armstrong-2002-v1, bittner-2000, chen-2002, golub-1999-v1, gordon-2002, pomeroy-2002-v1, shipp-2002-v1, singh-2002, west-2001, yeoh-2002-v1]
    env:
      RLR_DATASET_ID: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Install actual switchBox glmnet and DeCAF MCP package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-foreign r-cran-glmnet r-cran-proc r-cran-jsonlite r-cran-gplots
          sudo Rscript --vanilla -e 'install.packages("ncvreg",repos="https://cloud.r-project.org",quiet=TRUE)'
          Rscript --vanilla -e 'stopifnot(requireNamespace("ncvreg",quietly=TRUE));cat("NCVREG_PACKAGE=PASS\n")'
          NAME=switchBox_1.38.0.tar.gz
          for MIRROR in https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 "$MIRROR/$NAME" -o "/tmp/$NAME"; then break; fi
          done
          test -s "/tmp/$NAME"
          sudo R CMD INSTALL "/tmp/$NAME"
      - name: Frozen RLR implementation and auditor code integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s manuscript_lock/RLR3_submission_final.tex
          Rscript --vanilla -e 'parse("R/experimental/rlr_binary_outer5_v2.R");cat("R_CODE_PARSE_PASS\n")' >/dev/null
          python3 -m py_compile scripts/audit_rlr_binary_outer5_v2.py
          mkdir -p "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID" "results/rlr_binary_outer5_v2/$RLR_DATASET_ID"
          git rev-parse HEAD > "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/SOURCE_SHA.txt"
          git hash-object R/new/07_world_protocol_utils.R > "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/ORIGINAL_RLR_CORE_SHA.txt"
      - name: Download one public Schliep source and record SHA provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/rlr_full11_fetch_one_v1.py --dataset "$RLR_DATASET_ID" 2>&1 | tee "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/source.log"
          grep -qx 'RLR_11_ONE_PROCESSED_ARFF_SHA_PARITY=NOT_VERIFIED' "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/source.log"
          cp "results/rlr_full11_same_pairs_v1/$RLR_DATASET_ID/input_source_manifest.json" "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/source_manifest.json"
      - name: Run all five outer test folds and all three models
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_binary_outer5_v2.R 2>&1 | tee "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/fit.log"
          grep -qx 'RLR_BINARY_OUTER5_FIVE_FOLDS_THREE_METHODS=PASS' "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/fit.log"
          grep -qx 'RLR_BINARY_OUTER5_ALL_PATIENTS_EXACTLY_ONCE_PER_METHOD=PASS' "results/rlr_binary_outer5_v2/$RLR_DATASET_ID/fit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlr-binary-outer5-v2-${{ matrix.dataset }}-${{ github.run_id }}
          path: results/rlr_binary_outer5_v2/
          retention-days: 30
          if-no-files-found: warn
  audit:
    name: Replay all 165 outer-fold metrics and exact 11-dataset paired inference
    needs: cohort
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rlr-binary-outer5-v2-*
          path: downloaded
      - name: Independently recompute all held-out patient metrics and paired inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/rlr-binary-outer5-audit
          python3 scripts/audit_rlr_binary_outer5_v2.py --input downloaded --out results/rlr-binary-outer5-audit | tee results/rlr-binary-outer5-audit/audit.log
          grep -qx 'RLR_BINARY_OUTER5_165_FOLD_METRICS_INDEPENDENT_REPLAY=PASS' results/rlr-binary-outer5-audit/audit.log
          grep -qx 'RLR_BINARY_OUTER5_EVERY_PATIENT_EXACTLY_ONCE_PER_METHOD=PASS' results/rlr-binary-outer5-audit/audit.log
          grep -qx 'RLR_BINARY_OUTER5_EXACT_2048_SIGNFLIPS_AND_BH8=PASS' results/rlr-binary-outer5-audit/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlr-binary-outer5-all11-audit-${{ github.run_id }}
          path: results/rlr-binary-outer5-audit/
          retention-days: 30
