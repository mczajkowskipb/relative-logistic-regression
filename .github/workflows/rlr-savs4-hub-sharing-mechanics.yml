name: SAVS4 gene-hub reuse standalone math invariant

on:
  push:
    branches: [analysis/rlr-savs-hub-sharing-v4]
    paths:
      - '.github/workflows/rlr-savs4-hub-sharing-mechanics.yml'
      - 'R/experimental/test_rlr_savs_hub_sharing_v4.R'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install R without costly bioconductor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-foreign r-cran-glmnet r-cran-proc \
            r-cran-jsonlite r-cran-gplots
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
            https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
            https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
              "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then break; fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
      - name: Verify shared anchor hub with novel branch pair and monotone patient invariance
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/test_rlr_savs_hub_sharing_v4.R | tee hub_mechanics.log
          grep -qx 'SAVS4_ROOT_HUB_ALLOWED_BUT_IDENTICAL_PAIR_FORBIDDEN=PASS' hub_mechanics.log
          grep -qx 'SAVS4_PATHWISE_REUSE_PATIENT_MONOTONE_INVARIANT=PASS' hub_mechanics.log
          grep -qx 'SAVS4_ALL_MECHANICAL_TESTS=PASS' hub_mechanics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: savs4-hub-invariance-${{ github.run_id }}
          path: hub_mechanics.log
          retention-days: 21
