name: RLR Ordinal Anchor Score top-down tree V1

on:
  push:
    branches: [analysis/rlr-ordinal-anchor-score-tree-v1]
    paths:
      - 'R/experimental/rlr_rank_gate_core_v1.R'
      - 'R/experimental/test_rlr_rank_gate_invariance_v1.R'
      - 'R/experimental/rlr_rank_gate_pilot_v1.R'
      - 'scripts/rlr_rank_gate_independent_audit_v1.py'
      - 'R/experimental/rlr_anchor_majority_tree_v1.R'
      - 'R/experimental/rlr_anchor_majority_pilot_v1.R'
      - 'R/experimental/test_rlr_anchor_majority_tree_v1.R'
      - 'scripts/rlr_ordinal_anchor_score_audit_v1.py'
      - 'R/experimental/rlr_ordinal_anchor_score_tree_v1.R'
      - 'R/experimental/rlr_ordinal_anchor_score_pilot_v1.R'
      - 'R/experimental/test_rlr_ordinal_anchor_score_tree_v1.R'
      - 'scripts/rlr_ordinal_anchor_score_audit_v1.py'
      - '.github/workflows/rlr-ordinal-anchor-score-tree-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-invariant-stump:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install exact original RLR dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-foreign r-cran-glmnet \
            r-cran-proc r-cran-jsonlite r-cran-gplots \
            r-cran-biocmanager
          SWITCHBOX_NAME=switchBox_1.38.0.tar.gz
          for MIRROR in \
            https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.18/bioc/src/contrib \
            https://bioconductor.uib.no/packages/3.18/bioc/src/contrib
          do
            if curl -fsSL --connect-timeout 10 --max-time 35 \
              "$MIRROR/$SWITCHBOX_NAME" -o "/tmp/$SWITCHBOX_NAME"; then
              break
            fi
          done
          test -s "/tmp/$SWITCHBOX_NAME"
          sha256sum "/tmp/$SWITCHBOX_NAME"
          sudo R CMD INSTALL "/tmp/$SWITCHBOX_NAME"
          Rscript --vanilla -e 'for(p in c("glmnet","switchBox","foreign","pROC","jsonlite")) stopifnot(requireNamespace(p,quietly=TRUE))'
      - name: Parse R and Python, then run invariant tests
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e 'for(f in c(
           "R/experimental/rlr_rank_gate_core_v1.R",
           "R/experimental/rlr_anchor_majority_tree_v1.R",
           "R/experimental/rlr_ordinal_anchor_score_tree_v1.R",
           "R/experimental/rlr_ordinal_anchor_score_pilot_v1.R",
           "R/experimental/test_rlr_ordinal_anchor_score_tree_v1.R",
           "R/experimental/test_rlr_anchor_majority_tree_v1.R",
           "R/experimental/test_rlr_rank_gate_invariance_v1.R")) parse(f)'
          python3 -m py_compile scripts/rlr_ordinal_anchor_score_audit_v1.py
          Rscript --vanilla R/experimental/test_rlr_rank_gate_invariance_v1.R \
            2>&1 | tee /tmp/rank_gate_unit.log
          grep -qx 'RANK_GATE_ALL_MECHANICAL_TESTS=PASS' /tmp/rank_gate_unit.log
          Rscript --vanilla R/experimental/test_rlr_anchor_majority_tree_v1.R             2>&1 | tee /tmp/anchor_unit.log
          grep -qx 'ANCHOR_ALL_UNIT_TESTS=PASS' /tmp/anchor_unit.log
          Rscript --vanilla R/experimental/test_rlr_ordinal_anchor_score_tree_v1.R             2>&1 | tee /tmp/oasdt_unit.log
          grep -qx 'OASDT_ALL_MECHANICAL_TESTS=PASS' /tmp/oasdt_unit.log
      - name: Prepare isolated source and output manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          test -f R/new/07_world_protocol_utils.R
          test ! -e results/rlr_ordinal_anchor_score_tree_v1
          test ! -e results/rlr_pair_specific_evidence_v1
          mkdir -p results/rlr_ordinal_anchor_score_tree_v1 results/rlr_pair_specific_evidence_v1
          printf '%s\n' "$GITHUB_SHA" > results/rlr_ordinal_anchor_score_tree_v1/SOURCE_SHA.txt
          git hash-object R/new/07_world_protocol_utils.R \
            > results/rlr_ordinal_anchor_score_tree_v1/ORIGINAL_RLR_CORE_BLOB_SHA.txt
          printf '%s\n' \
            'Ordinal anchor score stump versus true greedy depth2: 3/5 reference genes, counts 0..K, D-only threshold learned 1..K; internal V selects stump or depth2, acceptance versus RLR and best single anchor comparator; original K20 untouched. Two exposed cohorts 3 E folds each, exact per-patient audit. Raw values/ratios forbidden; not independent validation.' \
            > results/rlr_ordinal_anchor_score_tree_v1/PROTOCOL.txt
      - name: Download original-paper source and run pilot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rlr_pair_specific_fetch.py 2>&1 | tee \
            results/rlr_ordinal_anchor_score_tree_v1/source_data.log
          grep -qx 'SPARSE_PUBLIC_REAL_COMP_CANCER_DATA_2_OF_2=PASS' \
            results/rlr_ordinal_anchor_score_tree_v1/source_data.log
          cp results/rlr_pair_specific_evidence_v1/input_manifest.json \
            results/rlr_ordinal_anchor_score_tree_v1/input_manifest.json
          Rscript --vanilla R/experimental/rlr_ordinal_anchor_score_pilot_v1.R 2>&1 | tee \
            results/rlr_ordinal_anchor_score_tree_v1/fit.log
          grep -qx 'OASDT_1442_E_PATIENT_PROBABILITY_ROWS=PASS' \
            results/rlr_ordinal_anchor_score_tree_v1/fit.log
      - name: Independently audit all E patients
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rlr_ordinal_anchor_score_audit_v1.py 2>&1 | tee \
            results/rlr_ordinal_anchor_score_tree_v1/independent_audit.log
          grep -qx 'OASDT_ALL_PATIENTS_COVERED_AND_FALLBACK_EXACT=PASS' \
            results/rlr_ordinal_anchor_score_tree_v1/independent_audit.log
          printf 'OASDT_PILOT_EXIT=0\n' > results/rlr_ordinal_anchor_score_tree_v1/status.txt
      - name: Archive evidence even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlr-ordinal-anchor-score-v1-${{ github.run_id }}
          path: |
            results/rlr_ordinal_anchor_score_tree_v1/*.csv
            results/rlr_ordinal_anchor_score_tree_v1/*.json
            results/rlr_ordinal_anchor_score_tree_v1/*.log
            results/rlr_ordinal_anchor_score_tree_v1/*.txt
          if-no-files-found: warn
          retention-days: 21
