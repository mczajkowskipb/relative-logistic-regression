name: RLR sparse-leaf real pilot Ubuntu apt

on:
  push:
    branches: [analysis/rlr-sparse-leaf-pilot-v1]
    paths:
      - '.github/workflows/rlr-sparse-leaf-apt.yml'
      - 'R/experimental/rlr_sparse_leaf_shared_v1.R'
      - 'R/experimental/rlr_sparse_leaf_real_pilot_v1.R'
      - 'scripts/rlr_sparse_leaf_fetch_real.py'
      - 'scripts/rlr_sparse_leaf_independent_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-development-smoke:
    name: Original RLR vs 2–5 sparse rank relations in leaves
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Provision Ubuntu system R + original RLR dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-foreign r-cran-glmnet \
            r-cran-proc r-cran-jsonlite r-cran-gplots \
            r-cran-biocmanager
          Rscript --version
          Rscript --vanilla -e 'BiocManager::install("switchBox",ask=FALSE,update=FALSE,quiet=TRUE)'
          Rscript --vanilla -e '
            for(pkg in c("switchBox","glmnet","foreign","pROC","jsonlite"))
              stopifnot(requireNamespace(pkg,quietly=TRUE))
            cat("SPARSE_EXACT_RLR_DEPENDENCIES=PASS\n")
            print(sessionInfo())'
      - name: Inspect locked source and create isolated results
        shell: bash
        run: |
          set -euo pipefail
          test -f manuscript_lock/RLR3_submission_final.tex
          test -f R/new/07_world_protocol_utils.R
          Rscript --vanilla -e 'for(f in c(
           "R/experimental/rlr_sparse_leaf_shared_v1.R",
           "R/experimental/rlr_sparse_leaf_real_pilot_v1.R"))
            parse(f)'
          python3 -m py_compile \
            scripts/rlr_sparse_leaf_fetch_real.py \
            scripts/rlr_sparse_leaf_independent_audit.py
          mkdir -p results/rlr_sparse_leaf_real_pilot_v1
          printf '%s\n' "$GITHUB_SHA" \
            > results/rlr_sparse_leaf_real_pilot_v1/SOURCE_SHA.txt
          git hash-object R/new/07_world_protocol_utils.R \
            > results/rlr_sparse_leaf_real_pilot_v1/ORIGINAL_RLR_CORE_BLOB_SHA.txt
          git hash-object R/experimental/rlmt_v4_rank_repair.R \
            > results/rlr_sparse_leaf_real_pilot_v1/ORIGINAL_RLR_WRAPPER_BLOB_SHA.txt
          printf '%s\n' \
            'DIAGNOSTIC REUSED COMP CANCER: fixed first two 3fold outer partitions, 2 datasets, 7 arms; original RLR strict OOF; gate and local 2/5 pair feature selection D-only, one V gate each, immutable heldout E predictions. NOT independent biomedical validation. No adaptive use of E.' \
            > results/rlr_sparse_leaf_real_pilot_v1/PROTOCOL.txt

      - name: Download and verify public expression matrices
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rlr_sparse_leaf_fetch_real.py 2>&1 | tee \
             results/rlr_sparse_leaf_real_pilot_v1/source_data.log
          grep -qx 'SPARSE_PUBLIC_REAL_COMP_CANCER_DATA_2_OF_2=PASS' \
             results/rlr_sparse_leaf_real_pilot_v1/source_data.log

      - name: Actual frozen original RLR plus sparse-leaf models
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/experimental/rlr_sparse_leaf_real_pilot_v1.R 2>&1 | tee \
            results/rlr_sparse_leaf_real_pilot_v1/model_fit.log
          grep -qx 'SPARSE_REAL_2_DATASETS_X_2_OUTER_FOLDS=PASS' \
            results/rlr_sparse_leaf_real_pilot_v1/model_fit.log
          grep -qx 'SPARSE_REAL_EXACT_FALLBACK_VERIFIED=PASS' \
            results/rlr_sparse_leaf_real_pilot_v1/model_fit.log

      - name: Independently recompute all genuine heldout E metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rlr_sparse_leaf_independent_audit.py 2>&1 | tee \
            results/rlr_sparse_leaf_real_pilot_v1/independent_audit.log
          grep -qx 'SPARSE_REAL_28_METHOD_STUDIES_INDEPENDENTLY_AUDITED=PASS' \
            results/rlr_sparse_leaf_real_pilot_v1/independent_audit.log
          grep -qx 'SPARSE_REAL_EXACT_PATIENT_LEVEL_RLR_FALLBACK=PASS' \
            results/rlr_sparse_leaf_real_pilot_v1/independent_audit.log
          printf 'SPARSE_REAL_PILOT_EXIT=0\n' \
            > results/rlr_sparse_leaf_real_pilot_v1/status.txt

      - name: Archive all evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlr-sparse-leaf-apt-${{ github.run_id }}
          path: |
            results/rlr_sparse_leaf_real_pilot_v1/*.csv
            results/rlr_sparse_leaf_real_pilot_v1/*.json
            results/rlr_sparse_leaf_real_pilot_v1/*.txt
            results/rlr_sparse_leaf_real_pilot_v1/*.log
          if-no-files-found: warn
          retention-days: 21
